name: Traffix
description: 'Traffix Systems was an Israeli 4G network-signaling company, founded
  in 2005, that offered Diameter signaling products (routing, load balancing, and
  gateway functions) for telecommunications service providers. Bessemer Venture Partners
  partnered with the company in 2011, and in 2012 Traffix was acquired by F5 Networks,
  which absorbed its Diameter signaling technology. The company no longer operates
  independently: its legacy domain traffixsystems.com is parked on F5 Networks
  infrastructure with no web presence, and Traffix publishes no public API, developer
  portal, or machine-readable surface.'
